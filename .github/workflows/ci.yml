name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: No data or credentials in the repository
        run: npm run guard
      - name: Type check
        run: npm run check
      - name: Tests (synthetic data only)
        run: npm test
      - name: Build
        run: npm run build
